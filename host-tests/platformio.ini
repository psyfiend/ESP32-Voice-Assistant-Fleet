; ---------------------------------------------------------------------------
; HOST TESTS (2.12 P5) - the firmware's pure modules, built and tested on the
; PC, off the board, in seconds: Layout (where cards go), TimeFormat (every
; time and duration the panel says) and Clock (the clock card's arithmetic,
; #100). None touches LVGL, Arduino or ESP-IDF.
;
;     pio test -d host-tests
;
; A PlatformIO project of its own, so the firmware's own environments never
; need a host compiler, and the all-nine gate builds nothing here. It needs gcc
; or clang on the PATH (README.md beside this file says how, and how to run the
; suites in WSL meanwhile). Run it before a board build whenever Layout or
; TimeFormat changes.
; ---------------------------------------------------------------------------
[platformio]
src_dir     = ../src
include_dir = ../include

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<Layout/> +<TimeFormat.cpp> +<Clock/>
build_flags = -std=gnu++17 -Wall -Wextra
