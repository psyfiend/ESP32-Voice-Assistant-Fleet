name=FleetI2C
version=0.1.0
author=Marge
maintainer=Marge
sentence=Uniform I2C access across the fleet, hiding which underlying ESP-IDF I2C driver a given board actually uses.
paragraph=Every board defaults to Arduino Wire. A board can opt into ESP-IDF's legacy driver/i2c.h instead by defining I2C_BACKEND_LEGACY in its platformio.ini build_flags - the backend choice lives here, once, not scattered as #ifdefs through every file that touches I2C.
