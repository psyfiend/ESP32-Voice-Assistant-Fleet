[env:WS_S3_TOUCH_LCD_5B]
board = esp32-s3-devkitc1-n16r8
lib_extra_dirs = /components
; No AudioManager: this board has no onboard audio hardware, and defaults
; to GPIOs (incl. RGB pin 0) that AudioManager would otherwise claim for I2S -
; see LVGL_Test_UI.cpp's HAS_AUDIO_HW guards. lib_deps is spelled out here
; instead of ${common.lib_deps} so AudioManager is never pulled in; the src
; filter below also drops Panel_Audio.cpp, which is the only remaining file
; that would still reference it.
lib_deps =
    GFX_Library_for_Arduino =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/GFX_Library_for_Arduino
    bb_captouch_fork        =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/bb_captouch_fork
    DisplayManager          =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/DisplayManager
    TouchManager            =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/TouchManager
    CH422G                  =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/CH422G
    FleetI2C                =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/FleetI2C
    Fleet_BSP               =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/Fleet_BSP
    lvgl                    =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/lvgl
lib_ignore = AudioManager
build_flags =
    ${S3-options.build_flags}
    -D BSP_HEADER='"BSP_WS_S3_TOUCH_LCD_5B.h"'
    -D HAS_RGB_PANEL
    -D HAS_TOUCH
    -D HAS_CH422G
    ; No I2C_BACKEND_* flag: uses FleetI2C's default Wire backend, same as every
    ; other board. Both I2C_BACKEND_LEGACY and I2C_BACKEND_BITBANG were tried while
    ; chasing this board's touch bug and are kept available in FleetI2C.cpp, but
    ; neither was actually the fix - see docs/BRINGUP_WS_S3_TOUCH_LCD_5B.md.
    -D HIGH_DPI_DISPLAY
    ; -D DEBUG_DISPLAY ; raw RGB color-fill test + LVGL flush-frame logging - see DisplayManager.cpp / GuiManager.cpp
    ; -D DEBUG_TOUCH   ; bb_captouch chip-detection + GT911 status-byte logging - see bb_captouch.cpp
    -D ARDUINO_USB_CDC_ON_BOOT=1
board_upload.flash_size = 16MB
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_src_filter =
    +<*>
    -<Panel_Audio.cpp> ; No AudioManager on this board - see lib_deps note above


