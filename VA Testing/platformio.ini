; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = WS_P4_TOUCH_LCD_7B
build_cache_dir = .pio/build_cache
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
[common]
lib_extra_dirs = /components
lib_dir = /components
;lib_ldf_mode = deep+
lib_deps =
    GFX_Library_for_Arduino =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/GFX_Library_for_Arduino
    bb_captouch_fork        =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/bb_captouch_fork
    DisplayManager          =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/DisplayManager
    TouchManager            =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/TouchManager
    FleetI2C                =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/FleetI2C
    AudioManager            =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/AudioManager
    Fleet_BSP               =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/Fleet_BSP

[S3-options]
build_flags =
    -D CONFIG_IDF_TARGET_ESP32S3
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_USE_MALLOC=1
    -D ARDUINO_USB_MODE=1
    -mfix-esp32-psram-cache-issue
    -I components/lvgl
    -I include/lvgl

[P4-options]
build_flags =
    -D CONFIG_IDF_TARGET_ESP32P4
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_USE_MALLOC=1
    -D ARDUINO_USB_MODE=1
    -D CONFIG_SPIRAM=1
    -D DOUBLE_BUFFER=1
    -I components/lvgl
    -I include/lvgl



[env:WS_P4_TOUCH_LCD_7B]
board = esp32-p4-evboard
;lib_ldf_mode = deep+
lib_extra_dirs = /components
lib_deps =
    ${common.lib_deps}
    lvgl            =symlink://c:/Users/Marge/Documents/PlatformIO/Projects/ESP32 Voice Assistant Fleet/VA Testing/components/lvgl
build_flags =
    ${P4-options.build_flags}
    -D BSP_HEADER='"BSP_WS_P4_TOUCH_LCD_7B.h"'
    -D HAS_MIPI_PANEL
    -D HAS_TOUCH
    -D HAS_AUDIO_HW
    -D HAS_ES8311
    -D HAS_ES7210
    -D ARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = default_16MB.csv
build_src_filter = +<*> ; Everything directly in src/


