sentence=Home Assistant websocket session for the ESP32 Voice Assistant Fleet.
paragraph=Owns the socket and the session only - connect, the three-message auth handshake, request ids, fragment reassembly and a retry ladder gated on Fleet_Connectivity's link state. Knows nothing about areas, entities or cards; those belong to a provider above it. The project's first asynchronous provider: its handler runs on the websocket task, never touches LVGL, and writes through EntityRegistry's mutex. See docs/design/ha-websocket.md and ROADMAP Q9.
