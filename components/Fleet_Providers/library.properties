sentence=Providers that populate the Entity Registry from real sources.
paragraph=A provider is the only code that bridges a source to the registry (DECISIONS A3). It writes values in and never renders anything and never touches LVGL. This is where Arduino and ESP-specific calls live, so Fleet_Entities can stay dependency-free and PC-testable. Providers: System, Battery, MQTT, HA (with its publisher and catalogue), and the command router.
