sentence=Providers that populate the Entity Registry from real sources.
paragraph=A provider is the only code that bridges a source to the registry (ROADMAP section 4.1). It writes values in and never renders anything, never touches LVGL, and never publishes to MQTT. This is where Arduino and ESP-specific calls live, so Fleet_Entities can stay dependency-free and PC-testable. Currently: SystemProvider (rssi/ip/uptime/heap), milestone 1.7.
