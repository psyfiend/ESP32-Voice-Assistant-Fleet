sentence=The Entity Registry for the ESP32 Voice Assistant Fleet.
paragraph=A single registry of entities that cards bind to and HA discovery is generated from, per ROADMAP section 4.1. Deliberately zero-dependency - no Arduino, no LVGL, no JSON - so it compiles and unit-tests on a PC. Providers write values under a short mutex and mark entities dirty; the LVGL task drains the dirty set. See ROADMAP section 4.2.
