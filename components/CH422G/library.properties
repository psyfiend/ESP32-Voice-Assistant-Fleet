sentence=Hand-rolled driver for the WCH CH422G IO expander.
paragraph=Not protocol-compatible with XCA9554/TCA9554 - see the header comment for why. Used by boards that need the expander for control-line GPIOs (reset lines, backlight, SD chip-select, general-purpose DIO) rather than as an Arduino_GFX databus.
